# project name
PROJECT_NAME: "lvi_sam"

lvi_sam:

  # Topics
  pointCloudTopic: "/cloud_registered_raw"     # Point cloud data from UrbanNav adapter
  imuTopic: "/livox/imu"                       # IMU data from UrbanNav adapter

  # Heading
  useImuHeadingInitialization: true          # if using GPS data, set to "true"
  
  # Export settings
  savePCD: false
  savePCDDirectory: "/Downloads/LOAM/"

  # Sensor Settings
  N_SCAN: 32                                  # UrbanNav center Velodyne rings 0..31
  Horizon_SCAN: 1800                          # Velodyne horizontal resolution
  timeField: "time"
  # UrbanNav /velodyne_points point time field is already seconds; do not rescale.
  pointTimeScale: 1.0                           # Velodyne timestamp field
  downsampleRate: 1

  # IMU Settings — UrbanNav HK-TST calibrated values
  imuAccNoise: 0.01119741
  imuGyrNoise: 0.01027090
  imuAccBiasN: 1.175177e-04
  imuGyrBiasN: 9.135538e-05
  imuGravity: 9.80511
  imuRPYWeight: 0.01
  
  # Extrinsics (lidar -> IMU)
  extrinsicTrans: [0.0, 0.0, -0.28]
  extrinsicRot: [1, 0, 0, 0, 1, 0, 0, 0, 1]
  extrinsicRPY: [1, 0, 0, 0, 1, 0, 0, 0, 1]

  # LOAM feature threshold
  edgeThreshold: 1.0
  surfThreshold: 0.1
  edgeFeatureMinValidNum: 10
  surfFeatureMinValidNum: 100

  # voxel filter params
  odometrySurfLeafSize: 0.4
  mappingCornerLeafSize: 0.2
  mappingSurfLeafSize: 0.4

  # robot motion constraint
  z_tollerance: 1000
  rotation_tollerance: 1000

  # CPU Params
  numberOfCores: 2
  mappingProcessInterval: 0.15

  # Surrounding map
  surroundingkeyframeAddingDistThreshold: 1.0
  surroundingkeyframeAddingAngleThreshold: 0.2
  surroundingKeyframeDensity: 2.0
  surroundingKeyframeSearchRadius: 50.0

  # Loop closure
  loopClosureEnableFlag: false
  surroundingKeyframeSize: 25
  historyKeyframeSearchRadius: 20.0
  historyKeyframeSearchTimeDiff: 30.0
  historyKeyframeSearchNum: 25
  historyKeyframeFitnessScore: 0.3

  # Visualization
  globalMapVisualizationSearchRadius: 1000.0
  globalMapVisualizationPoseDensity: 10.0
  globalMapVisualizationLeafSize: 1.0
