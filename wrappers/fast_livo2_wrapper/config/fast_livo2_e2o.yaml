# FAST-LIVO2 adapter config for E2O Faculty Loop.
# p_camera = Rcl * p_lidar103 + Pcl comes directly from supplied calibration.
# ASSUMPTIONS: IMU is aligned/co-located with lidar103; scan lines <=64; no sensor time offsets.
common:
  lid_topic: /livox/lidar
  imu_topic: /livox/imu
  img_topic: /camera/right/image_raw
  time_sync_en: false
  img_en: 1
  lidar_en: 1
  ros_driver_bug_fix: false
preprocess:
  lidar_type: 2
  scan_line: 64
  blind: 0.5
mapping:
  acc_cov: 0.01119741
  gyr_cov: 0.0102709
  b_acc_cov: 0.0001175177
  b_gyr_cov: 9.135538e-05
  fov_degree: 360.0
  det_range: 80.0
  extrinsic_est_en: false
  extrinsic_T:
  - 0.0
  - 0.0
  - 0.0
  extrinsic_R:
  - 1
  - 0
  - 0
  - 0
  - 1
  - 0
  - 0
  - 0
  - 1
imu:
  imu_en: true
  imu_int_frame: 30
  gravity_est_en: true
  ba_bg_est_en: true
  acc_cov: 0.5
  gyr_cov: 0.3
  b_acc_cov: 0.0001
  b_gyr_cov: 0.0001
extrin_calib:
  extrinsic_T:
  - 0.0
  - 0.0
  - 0.0
  extrinsic_R:
  - 1
  - 0
  - 0
  - 0
  - 1
  - 0
  - 0
  - 0
  - 1
  Pcl: &id001
  - 0.07383026
  - -0.5358112
  - -0.31010858
  Rcl: &id002
  - -0.18256836
  - -0.98306216
  - -0.01604916
  - 0.11110754
  - -0.00440978
  - -0.99379861
  - 0.97689503
  - -0.18321936
  - 0.1100307
time_offset:
  imu_time_offset: 0.0
  img_time_offset: 0.0
  lidar_time_offset: 0.0
  exposure_time_init: 0.0
vio:
  max_iterations: 5
  outlier_threshold: 1000
  img_point_cov: 1000
  patch_size: 8
  patch_pyrimid_level: 4
  normal_en: true
  raycast_en: false
  inverse_composition_en: false
  exposure_estimate_en: true
  inv_expo_cov: 0.1
lio:
  max_iterations: 5
  dept_err: 0.02
  beam_err: 0.05
  min_eigen_value: 0.005
  voxel_size: 1.0
  max_layer: 2
  max_points_num: 50
  layer_init_num:
  - 5
  - 5
  - 5
  - 5
  - 5
local_map:
  map_sliding_en: false
  half_map_size: 100
  sliding_thresh: 8
camera:
  img_topic: /camera/right/image_raw
  fx: 668.02585977
  fy: 658.80930843
  cx: 657.26752359
  cy: 363.16409155
  distortion_model: plumb_bob
  distortion_coeffs:
  - -0.05078581
  - 0.08456123
  - -0.00046157
  - 0.00656211
  - -0.03406049
  image_width: 1280
  image_height: 720
  cam_ext_T: *id001
  cam_ext_R: *id002
laserMapping:
  cam_model: Pinhole
  cam_width: 1280
  cam_height: 720
  scale: 1.0
  cam_fx: 668.02585977
  cam_fy: 658.80930843
  cam_cx: 657.26752359
  cam_cy: 363.16409155
  cam_d0: -0.05078581
  cam_d1: 0.08456123
  cam_d2: -0.00046157
  cam_d3: 0.00656211
publish:
  path_en: true
  scan_publish_en: true
  dense_publish_en: false
  scan_bodyframe_pub_en: true
pcd_save:
  pcd_save_en: true
  interval: -1
  pcd_path: /data/output/fast_livo2_map.pcd
