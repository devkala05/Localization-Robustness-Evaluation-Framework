frame_id: base_link
odom_frame_id: rtabmap_odom
publish_tf: false
wait_imu_to_init: true
# Both public clouds carry calibrated per-point acquisition times. Keep
# RTAB-Map's native constant-motion/IMU deskewing enabled for vehicle motion.
deskewing: true
deskewing_slerp: true
approx_sync: true
queue_size: 100
scan_cloud_max_points: 60000
Icp/PointToPlane: "false"
Icp/Iterations: "30"
Icp/VoxelSize: "0.20"
Icp/MaxCorrespondenceDistance: "1.0"
# Urban driving can exceed the indoor 0.2 m default between 10 Hz scans.
Icp/MaxTranslation: "1.5"
Odom/GuessMotion: "true"
Odom/FilteringStrategy: "1"
