# R3LIVE E2O config. Native input uses adapter-generated Livox CustomMsg.
# Camera-lidar calibration is supplied; IMU-lidar identity and <=64 rings are assumptions.
r3live_common:
  lid_topic: /livox/lidar_custom
  imu_topic: /livox/imu
  img_topic: /camera/image_raw
  lidar_type: 2
  scan_line: 64
  blind: 0.5
  pcd_save_en: false
  pcd_path: /data/output/r3live_map.pcd
  dense_publish_en: false
lio:
  acc_cov: 0.5
  gyr_cov: 0.3
  b_acc_cov: 0.0001
  b_gyr_cov: 0.0001
  extrinsic_T:
  - 0.0
  - 0.0
  - 0.0
  extrinsic_R:
  - 1
  - 0
  - 0
  - 0
  - 1
  - 0
  - 0
  - 0
  - 1
  max_iterations: 5
  fov_degree: 360.0
  det_range: 80.0
  extrinsic_est_en: false
vio:
  cam_fx: 668.02585977
  cam_fy: 658.80930843
  cam_cx: 657.26752359
  cam_cy: 363.16409155
  image_width: 1280
  image_height: 720
  cam_d0: -0.05078581
  cam_d1: 0.08456123
  cam_d2: -0.00046157
  cam_d3: 0.00656211
  cam_ext_R:
  - -0.18256836
  - -0.98306216
  - -0.01604916
  - 0.11110754
  - -0.00440978
  - -0.99379861
  - 0.97689503
  - -0.18321936
  - 0.1100307
  cam_ext_T:
  - 0.07383026
  - -0.5358112
  - -0.31010858
  max_iterations: 5
  patch_size: 8
  patch_pyrimid_level: 4
  outlier_threshold: 1000
  img_point_cov: 1000
  exposure_estimate_en: true
  inv_expo_cov: 0.1
