# FAST-LIO2 adapter config for E2O Faculty Loop.
# Black-box algorithm source is untouched.
# ASSUMPTIONS: lidar103 is the body origin; /mavros/imu/data is body-aligned;
# lidar103 ring id is 0..15; PointCloud2 relative-time field is named `time`.
# Replace identity extrinsics and noise values when measured calibration is available.
common:
  lid_topic: /cloud_registered_raw
  imu_topic: /livox/imu
  time_sync_en: false
preprocess:
  lidar_type: 2
  scan_line: 16
  blind: 0.5
  time_scale: 1.0
  point_filter_num: 3
mapping:
  acc_cov: 0.1
  gyr_cov: 0.1
  b_acc_cov: 0.0001
  b_gyr_cov: 0.0001
  fov_degree: 360.0
  det_range: 80.0
  extrinsic_est_en: false
  extrinsic_T:
  - 0.0
  - 0.0
  - 0.0
  extrinsic_R:
  - 1
  - 0
  - 0
  - 0
  - 1
  - 0
  - 0
  - 0
  - 1
publish:
  path_en: true
  scan_publish_en: true
  dense_publish_en: false
  scan_bodyframe_pub_en: true
pcd_save:
  pcd_save_en: false
  interval: -1
  pcd_path: /data/output/fast_lio2_map.pcd
