Camera.fx: 1475.616589
Camera.fy: 1475.379187
Camera.cx: 1211.035277
Camera.cy: 1022.872005
Camera.k1: 0.0
Camera.k2: 0.0
Camera.p1: 0.0
Camera.p2: 0.0
Camera.k3: 0.0
Camera.width: 2448
Camera.height: 2048
Camera.fps: 10
Camera.RGB: 0
# ORB uses bf not only to synthesize the RGB-D right coordinate, but also to
# weight depth/disparity constraints.  The former 80 px value represents only
# a 5.4 cm virtual baseline and lets the solution become nearly monocular on
# Boreas's low-parallax farm road. A conservative 0.65 m virtual LiDAR baseline
# gives measured projected depth appropriate leverage without changing depth.
Camera.bf: 959.15078285
DepthMapFactor: 1.0
RGBD.DepthMapFactor: 1.0
# ORB converts this dimensionless multiplier to metres as bf*ThDepth/fx.
# Retain measured projected depths through 100 m for stable high-speed metric
# tracking. The reproducible native build separately disables only the dense-
# RGB-D close-point keyframe trigger for plain RGBD.
ThDepth: 153.84615385
Stereo.ThDepth: 153.84615385
# Preserve roughly the upstream ORB-SLAM3 VGA feature density on the native
# 2448x2048 Boreas image. Lower budgets tracked the full route but left a
# repeatable high-speed distortion around t=80 s.
ORBextractor.nFeatures: 15000
ORBextractor.scaleFactor: 1.2
ORBextractor.nLevels: 8
ORBextractor.iniThFAST: 7
ORBextractor.minThFAST: 2
Tbc: !!opencv-matrix
   rows: 4
   cols: 4
   dt: f
   data: [0.999985098, 0.001080950, -0.005294156, -0.077635296,
          -0.005294444, -0.000369157, -0.999985645, -0.489184591,
          -0.001083823, 0.999999247, -0.000363770, -0.055849794,
           0.0, 0.0, 0.0, 1.0]
IMU.T_b_c1: !!opencv-matrix
   rows: 4
   cols: 4
   dt: f
   data: [0.999985098, 0.001080950, -0.005294156, -0.077635296,
          -0.005294444, -0.000369157, -0.999985645, -0.489184591,
          -0.001083823, 0.999999247, -0.000363770, -0.055849794,
           0.0, 0.0, 0.0, 1.0]
IMU.Frequency: 200
# The independent DMU is stationary for the first two sequence seconds.
# Its measured per-sample standard deviations are at most 0.00177 rad/s and
# 0.176 m/s^2. ORB multiplies these continuous noise densities by sqrt(200),
# so the values below conservatively cover that sensor-only measurement
# without downweighting preintegration by the former two orders of magnitude.
IMU.NoiseGyro: 0.0002
IMU.NoiseAcc: 0.02
IMU.GyroWalk: 0.00001
IMU.AccWalk: 0.001
IMU.g: 9.805
IMU.fastInit: 0
InsertKFsWhenLost: 1
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -1.8
Viewer.ViewpointF: 500.0
