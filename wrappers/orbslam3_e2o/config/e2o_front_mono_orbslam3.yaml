%YAML:1.0

# ORB-SLAM3 RGB-D camera config for E2O one_full_loop front camera.
# RGB is resized by e2o_sensor_adapter.py from 1280x720 to the depth image
# resolution, so intrinsics are scaled from the original front color camera.
Camera.type: "PinHole"
Camera1.fx: 442.56713210
Camera1.fy: 439.20620562
Camera1.cx: 435.43973438
Camera1.cy: 242.10939437
Camera1.k1: -0.05078581
Camera1.k2: 0.08456123
Camera1.p1: -0.00046157
Camera1.p2: 0.00656211
Camera1.k3: -0.03406049
Camera.fx: 442.56713210
Camera.fy: 439.20620562
Camera.cx: 435.43973438
Camera.cy: 242.10939437
Camera.k1: -0.05078581
Camera.k2: 0.08456123
Camera.p1: -0.00046157
Camera.p2: 0.00656211
Camera.k3: -0.03406049
Camera.width: 848
Camera.height: 480
# Measured from the adapted E2O stream: approximately 16.42 Hz over the run.
# ORB uses this for keyframe timing, so the former 10 Hz value was incorrect.
Camera.fps: 16
Camera.RGB: 1
Camera.bf: 34.21929065
ThDepth: 40.0
DepthMapFactor: 1000.0
Stereo.ThDepth: 40.0
Stereo.b: 0.07732
RGBD.DepthMapFactor: 1000.0

ORBextractor.nFeatures: 2000
ORBextractor.scaleFactor: 1.2
ORBextractor.nLevels: 8
ORBextractor.iniThFAST: 12
ORBextractor.minThFAST: 5

# IMU configuration for RGBD_Inertial mode.
#
# Tbc: transform FROM camera TO IMU/body frame (4x4, row-major).
# Used by Tracking.cc (ParseIMUParamFile) in the pinned V1.0 ref.
# Derived as inverse of params_camera_e2o.yaml extrinsicRotation/Translation
# (p_imu = R * p_cam + t). IMU is co-located with lidar103 (body frame),
# so this equals FAST-LIVO2 Rcl/Pcl.
Tbc: !!opencv-matrix
   rows: 4
   cols: 4
   dt: f
   data: [-0.18256836, -0.98306216, -0.01604916,  0.07383026,
           0.11110754, -0.00440978, -0.99379861, -0.53584490,
           0.97689503, -0.18321936,  0.11003070, -0.31004950,
           0.0,         0.0,         0.0,         1.0]

# IMU.T_b_c1: same matrix, kept for Settings.cc compatibility in newer ORB-SLAM3 refs.
IMU.T_b_c1: !!opencv-matrix
   rows: 4
   cols: 4
   dt: f
   data: [-0.18256836, -0.98306216, -0.01604916,  0.07383026,
           0.11110754, -0.00440978, -0.99379861, -0.53584490,
           0.97689503, -0.18321936,  0.11003070, -0.31004950,
           0.0,         0.0,         0.0,         1.0]

# IMU frequency (Hz). E2O IMU is published via MAVROS at 200 Hz.
IMU.Frequency: 200

# Continuous-time noise densities from shared IMU calibration
# (acc_n/gyr_n in params_camera_e2o.yaml and acc_cov/gyr_cov in fast_livo2_e2o.yaml).
IMU.NoiseGyro: 0.3
IMU.NoiseAcc: 0.5
IMU.GyroWalk: 0.0001
IMU.AccWalk: 0.0001
IMU.g: 9.80511

Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -1.8
Viewer.ViewpointF: 500.0
