dataset: kitti
standard_topics:
  lidar: /localization/lidar/pointcloud
  camera: /localization/camera/image_raw
  imu: /localization/imu/data
  gps: /localization/gps/fix
  odometry: /localization/odometry
  path: /localization/path
remappings:
  lidar_in:
    from: /kitti/velo/pointcloud
    to: /localization/lidar/pointcloud
  camera_in:
    from: /kitti/camera/color/left/image_raw
    to: /localization/camera/image_raw
  imu_in:
    from: /kitti/oxts/imu
    to: /localization/imu/data
  gps_in:
    from: /kitti/oxts/gps/fix
    to: /localization/gps/fix
  odom_out:
    from: "/{algo}/odometry"
    to: /localization/odometry
