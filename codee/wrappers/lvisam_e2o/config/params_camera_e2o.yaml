%YAML:1.0

project_name: "lvi_sam"

imu_topic: "/lvisam/imu_raw"
image_topic: "/lvisam/camera/image_raw"
point_cloud_topic: "lvi_sam/lidar/deskew/cloud_deskewed"

use_lidar: 1
lidar_skip: 3
align_camera_lidar_estimation: 1

# E2O lidar103/base to front camera transform, p_camera = R * p_lidar + t.
lidar_to_cam_tx: 0.07383026
lidar_to_cam_ty: -0.5358112
lidar_to_cam_tz: -0.31010858
lidar_to_cam_rx: -1.02997928
lidar_to_cam_ry: -1.35541531
lidar_to_cam_rz: 2.59488786

model_type: PINHOLE
camera_name: e2o_front_camera

image_width: 1280
image_height: 720
distortion_parameters:
   k1: -0.05078581
   k2: 0.08456123
   p1: -0.00046157
   p2: 0.00656211
projection_parameters:
   fx: 668.02585977
   fy: 658.80930843
   cx: 657.26752359
   cy: 363.16409155

acc_n: 0.5
gyr_n: 0.3
acc_w: 0.0001
gyr_w: 0.0001
g_norm: 9.80511

estimate_extrinsic: 0
# Camera to IMU/body transform, p_imu = R * p_camera + t.
extrinsicRotation: !!opencv-matrix
   rows: 3
   cols: 3
   dt: d
   data: [-0.18256836, 0.11110754, 0.97689503,
          -0.98306216, -0.00440978, -0.18321936,
          -0.01604916, -0.99379861, 0.1100307]

extrinsicTranslation: !!opencv-matrix
   rows: 3
   cols: 1
   dt: d
   data: [0.37595526, 0.01339903, -0.49718205]

max_cnt: 150
min_dist: 20
freq: 20
F_threshold: 1.0
show_track: 1
equalize: 1
fisheye: 0

max_solver_time: 0.035
max_num_iterations: 10
keyframe_parallax: 10.0

estimate_td: 1
td: 0.0

rolling_shutter: 0
rolling_shutter_tr: 0

loop_closure: 1
skip_time: 0.0
skip_dist: 0.0
debug_image: 0
match_image_scale: 0.5
vocabulary_file: "/config/brief_k10L6.bin"
brief_pattern_file: "/config/brief_pattern.yml"
