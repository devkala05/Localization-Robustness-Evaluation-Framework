version: "3.8"

# ════════════════════════════════════════════════════════════════════════
# FAST-LIVO2 Black-Box Testing Pipeline — Docker Compose
# ════════════════════════════════════════════════════════════════════════
# Services (start order):
#   1. roscore      – ROS master
#   2. bridge       – TF broadcaster + topic converter (UrbanNav → FAST-LIVO2)
#   3. recorder     – output collector (CSV / TUM / bag)
#   4. fastlivo2    – FAST-LIVO2 mapping node (black box, unmodified)
#   5. rviz         – RViz visualisation
#   (bag player is started inside run_pipeline.sh via tmux)
# ════════════════════════════════════════════════════════════════════════

services:

  # ── ROS Master ───────────────────────────────────────────────────────────────
  roscore:
    image: fastlivo2-wrapper:latest
    container_name: fastlivo2_roscore
    network_mode: host
    environment:
      - ROS_MASTER_URI=http://localhost:11311
      - ROS_HOSTNAME=localhost
      - DISPLAY=${DISPLAY}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    command: roscore
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rostopic", "list"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Topic bridge (TF broadcaster + UrbanNav→FAST-LIVO2 converter) ────────────
  bridge:
    image: fastlivo2-wrapper:latest
    container_name: fastlivo2_bridge
    network_mode: host
    depends_on:
      roscore:
        condition: service_healthy
    environment:
      - ROS_MASTER_URI=http://localhost:11311
      - ROS_HOSTNAME=localhost
      - DISPLAY=${DISPLAY}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./wrappers/fast_livo2_wrapper:/root/catkin_ws/src/fast_livo2_wrapper:ro
    command: >
      bash -c "source /root/catkin_ws/devel/setup.bash &&
               roslaunch fast_livo2_wrapper topic_bridge.launch"
    restart: unless-stopped

  # ── Output recorder ──────────────────────────────────────────────────────────
  recorder:
    image: fastlivo2-wrapper:latest
    container_name: fastlivo2_recorder
    network_mode: host
    depends_on:
      - bridge
    environment:
      - ROS_MASTER_URI=http://localhost:11311
      - ROS_HOSTNAME=localhost
    volumes:
      - ./data/output:/data/output
      - ./wrappers/fast_livo2_wrapper:/root/catkin_ws/src/fast_livo2_wrapper:ro
    command: >
      bash -c "source /root/catkin_ws/devel/setup.bash &&
               sleep 3 &&
               roslaunch fast_livo2_wrapper record_outputs.launch
                 output_dir:=/data/output"
    restart: unless-stopped

  # ── FAST-LIVO2 (black-box algorithm — no source modifications) ───────────────
  fastlivo2:
    image: fastlivo2-wrapper:latest
    container_name: fastlivo2_algo
    network_mode: host
    depends_on:
      - bridge
    environment:
      - ROS_MASTER_URI=http://localhost:11311
      - ROS_HOSTNAME=localhost
      - DISPLAY=${DISPLAY}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./data:/data
      - ./wrappers/fast_livo2_wrapper:/root/catkin_ws/src/fast_livo2_wrapper:ro
    command: >
      bash -c "source /root/catkin_ws/devel/setup.bash &&
               sleep 5 &&
               roslaunch fast_livo2_wrapper fast_livo2.launch"
    restart: unless-stopped

  # ── RViz ─────────────────────────────────────────────────────────────────────
  rviz:
    image: fastlivo2-wrapper:latest
    container_name: fastlivo2_rviz
    network_mode: host
    depends_on:
      - fastlivo2
    environment:
      - ROS_MASTER_URI=http://localhost:11311
      - ROS_HOSTNAME=localhost
      - DISPLAY=${DISPLAY}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./wrappers/fast_livo2_wrapper/config:/config:ro
    command: >
      bash -c "source /root/catkin_ws/devel/setup.bash &&
               sleep 8 &&
               rviz -d /config/fast_livo2.rviz"
    restart: unless-stopped
