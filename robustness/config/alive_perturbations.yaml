schema_version: 1
dataset: alive_one_full_loop

# All intervals are seconds from the first rosbag record timestamp. The three
# intervals are intentionally disjoint so each adverse condition is measured
# over a different, controlled part of the same physical trajectory.
input_bag: /home/devil/Desktop/car/localisation/Localization-Robustness-Evaluation-Framework/ss..'/data/e2o/one_full_loop.bag
random_seed: 24081996

topics:
  lidar:
    - /lidar103/velodyne_points
  camera:
    - /camera/color/image_raw
  depth:
    - /camera/depth/image_rect_raw
  gps:
    - /mavros/global_position/global
  imu:
    - /mavros/imu/data

scenarios:
  rain:
    start_time: 70.0
    end_time: 110.0
    severity: 0.65
    lidar:
      dropout_percentage: 35.0
      range_noise_std_m: 0.035
      maximum_usable_range_m: 65.0
      intensity_attenuation: 0.40
      false_return_percentage: 0.35
      false_return_min_range_m: 1.0
      false_return_max_range_m: 18.0

  fog:
    start_time: 140.0
    end_time: 180.0
    severity: 0.75
    lidar:
      dropout_percentage: 15.0
      range_noise_std_m: 0.020
      maximum_usable_range_m: 35.0
      intensity_attenuation: 0.65
      # Exponential attenuation models the lower probability of a return as
      # the two-way optical path through fog grows.
      extinction_coefficient_per_m: 0.030
      false_return_percentage: 0.05
      false_return_min_range_m: 1.0
      false_return_max_range_m: 10.0
    camera:
      degradation_strength: 0.72
      atmospheric_light: 0.82
      visibility_m: 35.0
      blur_sigma_px: 1.5
      depth_maximum_usable_range_m: 30.0
      depth_dropout_percentage: 8.0

  sensor_degradation:
    start_time: 210.0
    end_time: 250.0
    severity: 0.70
    gps:
      mode: multipath_then_outage
      horizontal_noise_std_m: 4.0
      vertical_noise_std_m: 7.0
      multipath_bias_east_m: 12.0
      multipath_bias_north_m: -8.0
      multipath_bias_up_m: 5.0
      outage_start_time: 228.0
      outage_end_time: 240.0
      # Dropping only NavSatFix messages is a real outage. All other bag
      # records retain their original event and header timestamps.
      drop_messages_during_outage: true
    imu:
      angular_velocity_noise_std_rad_s: 0.018
      linear_acceleration_noise_std_m_s2: 0.16
      angular_velocity_bias_rad_s: [0.006, -0.004, 0.009]
      linear_acceleration_bias_m_s2: [0.12, -0.08, 0.18]
      bias_random_walk_std_rad_s_sqrt_s: 0.0008
      accel_bias_random_walk_std_m_s2_sqrt_s: 0.008

evaluation:
  ground_truth: /home/devil/Desktop/car/localisation/Localization-Robustness-Evaluation-Framework/gt/reference_gt/trajectories/reference_trajectory_final.csv
  bag_start_time_s: 1723528213.157976
  alignment: se3
  max_association_difference_s: 0.10
  failure_error_threshold_m: 10.0
  failure_minimum_duration_s: 1.0
  dropout_gap_threshold_s: 1.0
  recovery_error_threshold_m: 2.0
  recovery_hold_duration_s: 3.0
  recovery_search_limit_s: 45.0

algorithms:
  - fastlivo2
  - fastlio2
  - lvisam
  - floam
  - orbslam3
  - rtabmap
